spring.application.name=upi-process-service
server.port=5454

# Configuracion del cron programacion de ejecuacion
cron.start=0 0 10 ? * 1-7
cron.stop=0 0 11 ? * 1-7

# Configuracion de rutas
route.autostart=true

logging.level.org.apache.camel=DEBUG
logging.level.org.apache.SQL=debug
logging.level.org.apache.camel.dataformat.bindy=TRACE


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.format_sql=true


#### CONNECTION POOLING (OPTIONAL) ####
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000


#### PROPERTIES TO BUILD FILE PATH ####
#source.type=file
source.location=${SOURCE_LOCATION}
target.error.location=${TARGET_ERROR_LOCATION} 
target.location=${TARGET_LOCATION}


